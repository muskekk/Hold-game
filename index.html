<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Lights in a Dark Room</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #020204;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    /* Dark Room */
    #room-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      filter: brightness(0.4) contrast(1.2);
      z-index: 0;
    }

    /* Dynamic Lighting Layer */
    #ambient-light {
      position: absolute;
      inset: 0;
      background: #020204;
      transition: background 0.15s ease-out;
      pointer-events: none;
      z-index: 1;
    }

    /* Flame and Flicker Animations */
    @keyframes flicker {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 0.95;
      }

      20% {
        transform: scale(1.03, 0.98) rotate(-1deg);
        opacity: 1;
      }

      40% {
        transform: scale(0.97, 1.02) rotate(1deg);
        opacity: 0.9;
      }

      60% {
        transform: scale(1.02, 1.01) rotate(-0.5deg);
        opacity: 0.98;
      }

      80% {
        transform: scale(0.99, 0.99) rotate(0.5deg);
        opacity: 0.93;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 0.95;
      }
    }

    @keyframes beamPulse {
      0%,
      100% {
        opacity: 0.85;
        transform: scaleX(1);
      }

      50% {
        opacity: 0.98;
        transform: scaleX(1.04);
      }
    }

    @keyframes pulseGlow {
      0%,
      100% {
        filter: drop-shadow(
          0 0 15px rgba(255, 200, 80, 0.4)
        );
      }

      50% {
        filter: drop-shadow(
          0 0 35px rgba(255, 180, 50, 0.8)
        );
      }
    }

    .flicker-active .flame-group {
      animation: flicker 0.25s infinite alternate ease-in-out;
      transform-origin: bottom center;
    }

    .flicker-active .light-beam {
      animation: beamPulse 0.4s infinite alternate ease-in-out;
      transform-origin: bottom center;
    }

    .flicker-active .glow-effect {
      animation: pulseGlow 1.5s infinite ease-in-out;
    }

    /* Lock Target */
    .lock-zone {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%) scale(0.7);
      width: 68px;
      height: 68px;

      background: rgba(10, 10, 15, 0.85);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.8rem;
      opacity: 0;
      pointer-events: none;

      transition: all 0.25s cubic-bezier(
        0.175,
        0.885,
        0.32,
        1.275
      );

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      z-index: 30;
      backdrop-filter: blur(8px);
    }

    .lock-zone.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .lock-zone.hovered {
      background: rgba(245, 158, 11, 0.3);
      border-color: #f59e0b;
      border-style: solid;

      transform: translateX(-50%) scale(1.3);

      box-shadow: 0 0 35px rgba(245, 158, 11, 0.7);
    }

    /* Locked Badge */
    .locked-badge {
      position: absolute;
      bottom: -40px;
      left: 50%;

      transform: translateX(-50%) translateY(10px);

      background: #f59e0b;
      color: #000;

      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;

      padding: 5px 16px;
      border-radius: 20px;

      opacity: 0;

      transition: all 0.3s cubic-bezier(
        0.175,
        0.885,
        0.32,
        1.275
      );

      pointer-events: none;
      white-space: nowrap;

      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.5);
    }

    .locked-badge.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Navigation Buttons */
    .nav-btn {
      transition: all 0.25s ease;
    }

    .nav-btn.active {
      background-color: #f59e0b;
      color: #000000;

      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }

    .nav-btn:not(.active):hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
  </style>
</head>

<body class="relative flex flex-col justify-between items-center select-none overflow-hidden">

  <!-- Dark Room Background -->
  <div id="room-bg"></div>

  <!-- Ambient Lighting -->
  <div id="ambient-light"></div>

  <!-- Top Navigation -->
  <header
    class="relative z-20 top-5 px-3 py-2 bg-neutral-900/90 backdrop-blur-md border border-neutral-800/80 rounded-full flex items-center gap-1 sm:gap-2 shadow-2xl max-w-[95vw] overflow-x-auto"
  >

    <!-- Candle -->
    <button
      data-type="candle"
      class="nav-btn active flex items-center gap-1.5 sm:gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-bold text-neutral-400 whitespace-nowrap"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a3 3 0 00-3 3c0 2 3 5 3 5s3-3 3-5a3 3 0 00-3-3zm-3 9v11h6V11H9z"/>
      </svg>
      <span>Candle</span>
    </button>

    <!-- Lantern -->
    <button
      data-type="lantern"
      class="nav-btn flex items-center gap-1.5 sm:gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-bold text-neutral-400 whitespace-nowrap"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 2h10v3l-2 3v14H9V8L7 5V2zm2 2v1h6V4H9z"/>
      </svg>
      <span>Lantern</span>
    </button>

    <!-- Light Bulb -->
    <button
      data-type="bulb"
      class="nav-btn flex items-center gap-1.5 sm:gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-bold text-neutral-400 whitespace-nowrap"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7zm-3 18a1 1 0 001 1h4a1 1 0 001-1v-1H9v1z"/>
      </svg>
      <span>Bulb</span>
    </button>

    <!-- Campfire -->
    <button
      data-type="campfire"
      class="nav-btn flex items-center gap-1.5 sm:gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-bold text-neutral-400 whitespace-nowrap"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2c-1.5 3-4 5.5-4 9a4 4 0 008 0c0-3.5-2.5-6-4-9zm-8 18l16-2m-16 2l16 2"/>
      </svg>
      <span>Campfire</span>
    </button>

  </header>

  <!-- Information Banner -->
  <div
    id="info-banner"
    class="relative z-20 mt-8 px-6 py-2.5 rounded-full bg-neutral-900/70 border border-neutral-800/80 backdrop-blur-md text-xs sm:text-sm font-semibold text-neutral-400 text-center transition-all duration-300 shadow-lg"
  >
    Press and hold the object to turn on the light
  </div>

  <!-- Main Light Object -->
  <main class="relative z-20 my-auto flex flex-col items-center justify-center">

    <!-- Lock Target -->
    <div id="lock-zone" class="lock-zone">
      <span id="lock-icon">🔓</span>
    </div>

    <!-- Active Object -->
    <div
      id="light-object"
      class="relative cursor-pointer p-6 rounded-3xl transition-transform duration-200 active:scale-95 flex items-center justify-center"
    >

      <!-- Graphics -->
      <div
        id="graphic-container"
        class="glow-effect transition-all duration-300 opacity-40 filter grayscale"
      >

        <!-- Candle SVG -->
        <svg
          id="svg-candle"
          viewBox="0 0 120 180"
          class="w-36 h-52 sm:w-44 sm:h-64"
        >
          <defs>

            <linearGradient
              id="candleBodyGrad"
              x1="0"
              y1="0"
              x2="1"
              y2="0"
            >
              <stop offset="0%" stop-color="#d1d5db"/>
              <stop offset="50%" stop-color="#f3f4f6"/>
              <stop offset="100%" stop-color="#9ca3af"/>
            </linearGradient>

            <radialGradient
              id="flameGlow"
              cx="50%"
              cy="50%"
              r="50%"
            >
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="30%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
            </radialGradient>

          </defs>

          <!-- Candle Body -->
          <rect
            x="42"
            y="75"
            width="36"
            height="90"
            rx="4"
            fill="url(#candleBodyGrad)"
          />

          <!-- Wax Drips -->
          <path
            d="M42 85 Q40 100 44 110 Q48 100 48 85 Z"
            fill="#e5e7eb"
          />

          <path
            d="M68 85 Q71 105 74 95 Q78 85 78 85 Z"
            fill="#e5e7eb"
          />

          <!-- Wick -->
          <line
            x1="60"
            y1="75"
            x2="60"
            y2="60"
            stroke="#1f2937"
            stroke-width="3"
            stroke-linecap="round"
          />

          <!-- Flame -->
          <g class="flame-group">

            <path
              d="M60 12 C42 38 46 55 60 62 C74 55 78 38 60 12 Z"
              fill="#f97316"
              opacity="0.95"
            />

            <path

              fill="#fbbf24"
            />

            <path

        </svg>

        <!-- Lantern SVG -->
        <svg
          id="svg-lantern"
          viewBox="0 0 140 200"
          class="w-36 h-52 sm:w-44 sm:h-64 hidden"
        >

          <defs>

            <linearGradient
              id="metalBody"
              x1="0"
              y1="0"
              x2="1"
              y2="0"
            >
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="40%" stop-color="#64748b"/>
              <stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>

            <linearGradient
              id="beamGrad"
              x1="0"
              y1="1"
              x2="0"
              y2="0"
            >
              <stop
                offset="0%"
                stop-color="rgba(253,224,71,0.8)"
              />

              <stop
                offset="100%"
                stop-color="rgba(253,224,71,0)"
              />
            </linearGradient>

          </defs>

          <!-- Light Beam -->
          <polygon
            class="light-beam opacity-0 transition-opacity duration-300"
            points="70,40 10,0 130,0"

          <!-- Lantern Head -->
          <path

          />

          <ellipse
            cx="70"
            cy="40"
            rx="40"
            ry="8"
            fill="#e2e8f0"
            stroke="#cbd5e1"
            stroke-width="2"
          />

          <ellipse
            class="lens-core"
            cx="70"
            cy="40"
            rx="32"
            ry="5"
            fill="#fef08a"
            opacity="0.6"
          />

          <!-- Lantern Body -->
          <rect
            x="52"
            y="70"
            width="36"
            height="100"
            rx="6"
            fill="url(#metalBody)"
          />

          <!-- Grip Lines -->
          <line x1="52" y1="90" x2="88" y2="90" stroke="#1e293b" stroke-width="3"/>
          <line x1="52" y1="105" x2="88" y2="105" stroke="#1e293b" stroke-width="3"/>
          <line x1="52" y1="120" x2="88" y2="120" stroke="#1e293b" stroke-width="3"/>
          <line x1="52" y1="135" x2="88" y2="135" stroke="#1e293b" stroke-width="3"/>

          <!-- Power Button -->
          <rect
            x="63"
            y="148"
            width="14"
            height="18"
            rx="3"
            fill="#ef4444"
            stroke="#7f1d1d"
            stroke-width="1.5"
          />

          <!-- Bottom Cover -->
          <rect
            x="50"
            y="170"
            width="40"
            height="12"
            rx="3"
            fill="#0f172a"
          />

        </svg>

        <!-- Light Bulb SVG -->
        <svg
          id="svg-bulb"
          viewBox="0 0 120 180"
          class="w-36 h-52 sm:w-44 sm:h-64 hidden"
        >

          <defs>

            <radialGradient
              id="bulbGlass"
              cx="50%"
              cy="40%"
              r="50%"
            >
              <stop
                offset="0%"
                stop-color="rgba(255,255,255,0.8)"
              />

              <stop
                offset="70%"
                stop-color="rgba(255,255,255,0.2)"
              />

              <stop
                offset="100%"
                stop-color="rgba(255,255,255,0.05)"
              />
            </radialGradient>

          </defs>

          <!-- Glass -->
          <path
            d="M60 20 C32 20 22 48 34 78 C40 92 46 102 46 115 L74 115 C74 102 80 92 86 78 C98 48 88 20 60 20 Z"
            fill="url(#bulbGlass)"
            stroke="rgba(255,255,255,0.4)"
            stroke-width="2.5"
          />

          <!-- Filament -->
          <path
            class="flame-group"
            d="M52 115 L52 75 L57 65 L60 70 L63 65 L68 75 L68 115"
            fill="none"
            stroke="#f59e0b"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Metal Base -->
          <path
            d="M46 115 L74 115 L72 123 L48 123 Z"
            fill="#94a3b8"
            stroke="#64748b"
          />

          <path
            d="M47 123 L73 123 L71 131 L49 131 Z"
            fill="#64748b"
            stroke="#475569"
          />

          <path
            d="M48 131 L72 131 L70 139 L50 139 Z"
            fill="#475569"
            stroke="#334155"
          />

          <!-- Contact Point -->
          <path

        <!-- Campfire SVG -->
        <svg
          id="svg-campfire"
          viewBox="0 0 160 180"
          class="w-44 h-52 sm:w-56 sm:h-64 hidden"
        >

          <defs>

            <linearGradient
              id="logGrad1"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >
              <stop offset="0%" stop-color="#78350f"/>
              <stop offset="100%" stop-color="#451a03"/>
            </linearGradient>

            <linearGradient
              id="logGrad2"
              x1="1"
              y1="0"
              x2="0"
              y2="1"
            >
              <stop offset="0%" stop-color="#92400e"/>
              <stop offset="100%" stop-color="#3a1200"/>
            </linearGradient>

          </defs>

          <!-- Wooden Logs -->
          <g id="wooden-logs">

            <rect
              x="25"
              y="132"
              width="110"
              height="22"
              rx="10"
              fill="url(#logGrad1)"
              transform="rotate(-15 80 143)"
              stroke="#270e03"
              stroke-width="2"
            />

            <ellipse
              cx="28"
              cy="148"
              rx="5"
              ry="10"
              fill="#b45309"
              transform="rotate(-15 80 143)"
            />

            <rect
              x="25"
              y="132"
              width="110"
              height="22"
              rx="10"
              fill="url(#logGrad2)"
              transform="rotate(15 80 143)"
              stroke="#270e03"
              stroke-width="2"
            />

            <ellipse
              cx="132"
              cy="148"
              rx="5"
              ry="10"
              fill="#b45309"
              transform="rotate(15 80 143)"
            />

            <rect
              x="30"
              y="146"
              width="100"
              height="24"
              rx="11"
              fill="#78350f"
              stroke="#1c0a02"
              stroke-width="2.5"
            />

            <ellipse
              cx="38"
              cy="158"
              rx="6"
              ry="10"
              fill="#d97706"
            />

            <ellipse
              cx="38"
              cy="158"
              rx="3"
              ry="5"
              fill="#78350f"
            />

            <ellipse
              cx="122"
              cy="158"
              rx="6"
              ry="10"
              fill="#d97706"
            />

            <ellipse
              cx="122"
              cy="158"
              rx="3"
              ry="5"
              fill="#78350f"
            />

          </g>

          <!-- Ember Glow -->
          <ellipse
            cx="80"
            cy="142"
            rx="35"
            ry="8"
            fill="#ea580c"
            opacity="0.6"
            filter="blur(3px)"
          />

          <!-- Fire -->
          <g class="flame-group">

            <path
              d="M80 18 C48 60 38 98 44 132 C60 144 100 144 116 132 C122 98 112 60 80 18 Z"
              fill="#dc2626"
              opacity="0.9"
            />

            <path
              d="M80 38 C58 72 50 102 56 128 C68 138 92 138 104 128 C110 102 102 72 80 38 Z"
              fill="#f97316"
            />

            <path
              d="M80 62 C68 88 62 108 66 124 C72 130 88 130 94 124 C98 108 92 88 80 62 Z"
              fill="#fbbf24"
            />

            <path
              d="M80 88 C74 102 72 114 74 120 C77 124 83 124 86 120 C88 114 86 102 80 88 Z"
              fill="#ffffff"
            />

          </g>

        </svg>

      </div>

      <!-- Locked Badge -->
      <div id="locked-badge" class="locked-badge">
        LOCKED 🔒
      </div>

    </div>

  </main>

  <!-- Bottom Information -->
  <footer
    class="relative z-20 bottom-5 text-neutral-500 text-xs text-center font-medium"
  >
    Click anywhere outside the object to turn the light off
  </footer>

  <script>

    /* Light Source Configuration */
    const LIGHT_CONFIGS = {

      candle: {
        name: 'Candle',
        color: 'rgba(245, 158, 11, 0.88)',
        radius: 480,
        flicker: true
      },

      lantern: {
        name: 'Lantern',
        color: 'rgba(253, 224, 71, 0.92)',
        radius: 650,
        flicker: false
      },

      bulb: {
        name: 'Bulb',
        color: 'rgba(254, 240, 138, 0.95)',
        radius: 750,
        flicker: false
      },

      campfire: {
        name: 'Campfire',
        color: 'rgba(239, 68, 68, 0.9)',
        radius: 700,
        flicker: true
      }

    };


    /* Application State */
    let activeType = 'candle';
    let isHolding = false;
    let isLocked = false;
    let isHoveringLock = false;


    /* DOM Elements */
    const ambientLight =
      document.getElementById('ambient-light');

    const roomBg =
      document.getElementById('room-bg');

    const lightObject =
      document.getElementById('light-object');

    const graphicContainer =
      document.getElementById('graphic-container');

    const lockZone =
      document.getElementById('lock-zone');

    const lockIcon =
      document.getElementById('lock-icon');

    const lockedBadge =
      document.getElementById('locked-badge');

    const infoBanner =
      document.getElementById('info-banner');

    const navBtns =
      document.querySelectorAll('.nav-btn');


    /* Change Light Source */
    navBtns.forEach(btn => {

      btn.addEventListener('click', (event) => {

        event.stopPropagation();

        const type = btn.dataset.type;

        if (type === activeType) {
          return;
        }

        turnOffLight();

        navBtns.forEach(button => {
          button.classList.remove('active');
        });

        btn.classList.add('active');

        document
          .querySelectorAll('#graphic-container > svg')
          .forEach(svg => {
            svg.classList.add('hidden');
          });

        document
          .getElementById(`svg-${type}`)
          .classList.remove('hidden');

        activeType = type;

      });

    });


    /* Press and Hold Object */
    lightObject.addEventListener('pointerdown', (event) => {

      event.stopPropagation();

      isHolding = true;
      isLocked = false;

      lockZone.classList.add('visible');
      lockZone.classList.remove('hovered');

      lockIcon.textContent = '🔓';

      turnOnLight();

      infoBanner.textContent =
        'Drag toward the lock icon to lock the light';

      infoBanner.style.color = '#f59e0b';

    });


    /* Pointer Movement */
    window.addEventListener('pointermove', (event) => {

      if (!isHolding || isLocked) {
        return;
      }

      const rect =
        lockZone.getBoundingClientRect();

      const padding = 25;

      const inside =
        event.clientX >= rect.left - padding &&
        event.clientX <= rect.right + padding &&
        event.clientY >= rect.top - padding &&
        event.clientY <= rect.bottom + padding;

      if (inside) {

        if (!isHoveringLock) {

          isHoveringLock = true;

          lockZone.classList.add('hovered');

          lockIcon.textContent = '🔒';

        }

      } else {

        if (isHoveringLock) {

          isHoveringLock = false;

          lockZone.classList.remove('hovered');

          lockIcon.textContent = '🔓';

        }

      }

    });


    /* Pointer Release */
    window.addEventListener('pointerup', () => {

      if (!isHolding) {
        return;
      }

      if (isHoveringLock) {

        isLocked = true;

        lockedBadge.classList.add('show');

        lockZone.classList.remove(
          'visible',
          'hovered'
        );

        infoBanner.textContent =
          'Light locked 🔒 — click anywhere to turn it off';

        infoBanner.style.color = '#10b981';

      } else {

        turnOffLight();

      }

      isHolding = false;
      isHoveringLock = false;

    });


    /* Turn Off When Clicking Outside */
    window.addEventListener('pointerdown', (event) => {

      if (
        !event.target.closest('#light-object') &&
        !event.target.closest('header')
      ) {
        turnOffLight();
      }

    });


    /* Turn Light On */
    function turnOnLight() {

      const config =
        LIGHT_CONFIGS[activeType];

      graphicContainer.classList.remove(
        'opacity-40',
        'grayscale'
      );

      graphicContainer.classList.add(
        'opacity-100'
      );


      if (config.flicker) {

        graphicContainer.classList.add(
          'flicker-active'
        );

      }


      /* Enable Lantern Beam */
      if (activeType === 'lantern') {

        const beam =
          document.querySelector(
            '#svg-lantern .light-beam'
          );

        if (beam) {
          beam.classList.remove('opacity-0');
        }

      }


      /* Calculate Light Position */
      const rect =
        graphicContainer.getBoundingClientRect();

      const x =
        rect.left + rect.width / 2;

      const y =
        rect.top + rect.height / 2;


      /* Apply Radial Light */
      ambientLight.style.background =
        `radial-gradient(
          circle ${config.radius}px
          at ${x}px ${y}px,
          ${config.color} 0%,
          rgba(2, 2, 4, 0.98) 100%
        )`;

    }


    /* Turn Light Off */
    function turnOffLight() {

      isHolding = false;
      isLocked = false;
      isHoveringLock = false;


      graphicContainer.classList.add(
        'opacity-40',
        'grayscale'
      );

      graphicContainer.classList.remove(
        'opacity-100',
        'flicker-active'
      );


      /* Disable Lantern Beam */
      if (activeType === 'lantern') {

        const beam =
          document.querySelector(
            '#svg-lantern .light-beam'
          );

        if (beam) {
          beam.classList.add('opacity-0');
        }

      }


      lockZone.classList.remove(
        'visible',
        'hovered'
      );

      lockIcon.textContent = '🔓';

      lockedBadge.classList.remove('show');


      /* Reset Lighting */
      ambientLight.style.background =
        '#020204';


      infoBanner.textContent =
        'Press and hold the object to turn on the light';

      infoBanner.style.color =
        '#9ca3af';

    }

  </script>

</body>
</html>
